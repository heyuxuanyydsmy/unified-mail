<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录测试</title>
</head>
<body>
  <h2>登录测试</h2>
  <input id="pwd" type="password" placeholder="输入密码">
  <button onclick="doLogin()">点击登录</button>
  <p id="result"></p>

  <script>
    function doLogin() {
      var password = document.getElementById('pwd').value;
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password })
      })
      .then(function(res) {
        if (res.ok) {
          document.getElementById('result').innerText = '登录成功！';
        } else {
          document.getElementById('result').innerText = '密码错误';
        }
      })
      .catch(function(err) {
        document.getElementById('result').innerText = '请求失败';
      });
    }
  </script>
</body>
</html>
